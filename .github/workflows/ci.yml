name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Синтаксис index.js
        run: node --check index.js
      - name: Проверка состава пакета
        run: npm pack --dry-run
